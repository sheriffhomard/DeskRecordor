[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deskrecordor"
version = "0.1.0"
description = "Desktop screen and voice recorder for Debian"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DeskRecordor Team" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
